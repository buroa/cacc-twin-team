# cacc-twin-team — CACC = Codex And Claude Code, the two harnesses on the team.
# A GPT-first team for the standard Gas City roles.
#
# One import gives you the whole crew: the fourteen gascity role workers,
# thirteen running GPT-6 models on the codex harness and one (the
# implementation reviewer) running Claude Sonnet on the claude harness, so the
# merge gate on Sol-written code comes from a different model family.
#
# Consume it with ONE city-level import, bound as `gc` (see README.md):
#   [imports.gc]
#   source = ".../cacc-twin-team"
# Each rig surface gets the role workers (scope = "rig") as `<rig>/gc.<role>`,
# so the gascity formulas' `gc.<role>` targets keep resolving. Don't also import
# gascity/roles directly or you get a second, unconfigured copy of every role.

[pack]
name = "cacc-twin-team"
schema = 2
version = "0.1.5"
description = "GPT-6 workers for the standard gascity roles, with a Claude Sonnet implementation reviewer."

# Effort is pinned on every preset on purpose: gascity's builtin codex provider
# defaults effort to xhigh and builtin claude to max, which would make the
# cheap tiers expensive.
[providers.cacc-astra]
base = "builtin:codex"
option_defaults = { model = "gpt-6-astra", effort = "high" }

[providers.cacc-sol]
base = "builtin:codex"
option_defaults = { model = "gpt-6.1-sol", effort = "high" }

[providers.cacc-luna]
base = "builtin:codex"
option_defaults = { model = "gpt-6-luna", effort = "high" }

# Full model id: gascity's claude alias table (through 1.5.0) stops at
# sonnet-5, and Claude Code rejects a bare "sonnet-5-5".
[providers.cacc-sonnet]
base = "builtin:claude"
option_defaults = { model = "claude-sonnet-5-5", effort = "high" }

# The fourteen standard role workers (requirements-planner, task-decomposer,
# implementation-worker, the reviewers, publisher, run-operator, ...).
# The consumer's import binding overrides this one, so bind the pack as `gc`
# at the rig level and these surface as gc.<role>.
[imports.roles]
source = "https://github.com/gastownhall/gascity-packs/tree/main/gascity/roles"
version = "sha:520e95cb22992a8a1017f7a60da267f203497c7e"

# Put every imported role on its crew. Patches, not [agent_defaults]:
# pack-scoped agent_defaults only reach this pack's own agents, and the
# resolver silently falls back to the city's workspace.provider for any agent
# left blank — which would un-twin the team without an error.
#
# Astra: the one-shot design plan everything downstream traces to.
# Sol: every role that writes or judges code and artifacts.
# Luna: deterministic plumbing (gates, scripts, metadata, push and PR).
# Sonnet: the implementation reviewer, a second model family on Sol's code.
[[patches.agent]]
name = "requirements-planner"
provider = "cacc-sol"

[[patches.agent]]
name = "task-decomposer"
provider = "cacc-sol"

[[patches.agent]]
name = "design-author"
provider = "cacc-astra"

[[patches.agent]]
name = "gap-analyst"
provider = "cacc-sol"

[[patches.agent]]
name = "implementation-worker"
provider = "cacc-sol"
option_defaults = { effort = "xhigh" }

[[patches.agent]]
name = "implementation-reviewer"
provider = "cacc-sonnet"

[[patches.agent]]
name = "design-implementation-reviewer"
provider = "cacc-sol"

[[patches.agent]]
name = "design-test-risk-reviewer"
provider = "cacc-sol"

[[patches.agent]]
name = "review-synthesizer"
provider = "cacc-sol"

[[patches.agent]]
name = "issue-triager"
provider = "cacc-sol"

[[patches.agent]]
name = "publisher"
provider = "cacc-luna"

[[patches.agent]]
name = "run-operator"
provider = "cacc-luna"

[[patches.agent]]
name = "feature-refiner"
provider = "cacc-luna"

[[patches.agent]]
name = "quality-judge"
provider = "cacc-sol"
