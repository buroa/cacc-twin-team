# cacc-twin-team — CACC = Codex And Claude Code, the two harnesses on the team.
# A two-model team for the standard Gas City roles.
#
# One import gives you the whole crew: a Claude Fable mayor supervising the
# twelve gascity role workers, all running GPT-5.6 Sol on the codex harness.
#
# Consume it with ONE city-level import, bound as `gc` (see README.md):
#   [imports.gc]
#   source = ".../cacc-twin-team"
# Each rig surface gets the role workers (scope = "rig") as `<rig>/gc.<role>`,
# so the gascity formulas' `gc.<role>` targets keep resolving. Don't also import
gascity/roles directly or you get a second, unconfigured copy of every role.

[pack]
name = "cacc-twin-team"
schema = 2
version = "0.1.2"
description = "GPT-6.1 Sol workers for the standard gascity roles."

[providers.cacc-sol]
base = "builtin:codex"
option_defaults = { model = "gpt-6.1-sol" }

# The twelve standard role workers (requirements-planner, task-decomposer,
# implementation-worker, the reviewers, publisher, run-operator, ...).
# The consumer's import binding overrides this one, so bind the pack as `gc`
# at the rig level and these surface as gc.<role>.
[imports.roles]
source = "https://github.com/gastownhall/gascity-packs/tree/main/gascity/roles"
version = "sha:db4bd054af468dce715293544d3a55d94f029a05"

# Put every imported role on the Sol crew. Patches, not [agent_defaults]:
# pack-scoped agent_defaults only reach this pack's own agents, and the
# resolver silently falls back to the city's workspace.provider for any agent
# left blank — which would un-twin the team without an error.
[[patches.agent]]
name = "requirements-planner"
provider = "cacc-sol"

[[patches.agent]]
name = "task-decomposer"
provider = "cacc-sol"

[[patches.agent]]
name = "design-author"
provider = "cacc-sol"

[[patches.agent]]
name = "gap-analyst"
provider = "cacc-sol"

[[patches.agent]]
name = "implementation-worker"
provider = "cacc-sol"

[[patches.agent]]
name = "implementation-reviewer"
provider = "cacc-sol"

[[patches.agent]]
name = "design-implementation-reviewer"
provider = "cacc-sol"

[[patches.agent]]
name = "design-test-risk-reviewer"
provider = "cacc-sol"

[[patches.agent]]
name = "review-synthesizer"
provider = "cacc-sol"

[[patches.agent]]
name = "issue-triager"
provider = "cacc-sol"

[[patches.agent]]
name = "publisher"
provider = "cacc-sol"

[[patches.agent]]
name = "run-operator"
provider = "cacc-sol"
